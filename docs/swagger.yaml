swagger: '2.0'
info:
  title: Delcom Blog API
  description: 'REST API Delcom Blog: artikel multi-tier, AI Blog Generator dengan
    integrasi Search Engine. Format respons standar {status, message, data?}.'
  version: '1.0'
basePath: /
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: 'Isi dengan: Bearer <token JWT>'
tags:
- name: Publik
- name: Auth
- name: Penulis
- name: AI
- name: Admin
- name: Dokumentasi
paths:
  /api.json:
    get:
      tags:
      - Dokumentasi
      summary: Spesifikasi OpenAPI/Swagger JSON dinamis
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
  /api/public/categories:
    get:
      tags:
      - Publik
      summary: Daftar kategori artikel
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
  /api/public/posts:
    get:
      tags:
      - Publik
      summary: Daftar artikel terbit (pencarian & filter kategori)
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
              data:
                type: array
                items:
                  $ref: '#/definitions/PostResponse'
        '500':
          description: Kesalahan server
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: q
        in: query
        type: string
        description: Kata kunci
      - name: category
        in: query
        type: string
        description: Filter kategori
  /api/public/posts/{slug}:
    get:
      tags:
      - Publik
      summary: Detail artikel terbit berdasarkan slug
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
              data:
                $ref: '#/definitions/PostResponse'
        '404':
          description: Tidak ditemukan
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Kesalahan server
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: slug
        in: path
        required: true
        type: string
  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Registrasi penulis baru
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '201':
          description: Dibuat
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
              data:
                $ref: '#/definitions/UserResponse'
        '400':
          description: Permintaan tidak valid
          schema:
            $ref: '#/definitions/ErrorResponse'
        '409':
          description: Konflik data
          schema:
            $ref: '#/definitions/ErrorResponse'
        '429':
          description: Terlalu banyak request
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Kesalahan server
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/RegisterRequest'
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Login dan penerbitan token JWT
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
              data:
                $ref: '#/definitions/AuthResponse'
        '400':
          description: Permintaan tidak valid
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          schema:
            $ref: '#/definitions/ErrorResponse'
        '429':
          description: Terlalu banyak request
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Kesalahan server
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
  /api/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout sesi
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
        '401':
          description: Tidak terautentikasi
          schema:
            $ref: '#/definitions/ErrorResponse'
      security: &id001
      - BearerAuth: []
  /api/auth/profile:
    get:
      tags:
      - Auth
      summary: Profil pengguna login
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
              data:
                $ref: '#/definitions/UserResponse'
        '401':
          description: Tidak terautentikasi
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: Tidak ditemukan
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Kesalahan server
          schema:
            $ref: '#/definitions/ErrorResponse'
      security: *id001
    put:
      tags:
      - Auth
      summary: Perbarui profil
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
              data:
                $ref: '#/definitions/UserResponse'
        '400':
          description: Permintaan tidak valid
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: Tidak ditemukan
          schema:
            $ref: '#/definitions/ErrorResponse'
        '409':
          description: Konflik data
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Kesalahan server
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdateProfileRequest'
      security: *id001
  /api/posts:
    get:
      tags:
      - Penulis
      summary: Daftar artikel milik penulis (terbit & draf)
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
              data:
                type: array
                items:
                  $ref: '#/definitions/PostResponse'
        '401':
          description: Tidak terautentikasi
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Kesalahan server
          schema:
            $ref: '#/definitions/ErrorResponse'
      security: *id001
    post:
      tags:
      - Penulis
      summary: Buat artikel (slug unik & reading time otomatis)
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '201':
          description: Dibuat
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
              data:
                $ref: '#/definitions/PostResponse'
        '400':
          description: Permintaan tidak valid
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Kesalahan server
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/CreatePostRequest'
      security: *id001
  /api/posts/stats:
    get:
      tags:
      - Penulis
      summary: Ringkasan 3 kartu statistik
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
              data:
                $ref: '#/definitions/StatsResponse'
        '401':
          description: Tidak terautentikasi
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Kesalahan server
          schema:
            $ref: '#/definitions/ErrorResponse'
      security: *id001
  /api/posts/ai-generate:
    post:
      tags:
      - AI
      summary: Generate draf artikel dengan AI + Search Engine
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
              data:
                $ref: '#/definitions/GenerateResponse'
        '400':
          description: Permintaan tidak valid
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          schema:
            $ref: '#/definitions/ErrorResponse'
        '429':
          description: Terlalu banyak request
          schema:
            $ref: '#/definitions/ErrorResponse'
        '502':
          description: Layanan AI/Search bermasalah
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/GenerateRequest'
      security: *id001
  /api/posts/{id}:
    get:
      tags:
      - Penulis
      summary: Detail artikel milik penulis
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
              data:
                $ref: '#/definitions/PostResponse'
        '400':
          description: Permintaan tidak valid
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: Tidak ditemukan
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Kesalahan server
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        type: integer
        description: ID
      security: *id001
    put:
      tags:
      - Penulis
      summary: Perbarui artikel
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
              data:
                $ref: '#/definitions/PostResponse'
        '400':
          description: Permintaan tidak valid
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: Tidak ditemukan
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Kesalahan server
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        type: integer
        description: ID
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/UpdatePostRequest'
      security: *id001
    delete:
      tags:
      - Penulis
      summary: Hapus artikel
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
        '400':
          description: Permintaan tidak valid
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: Tidak ditemukan
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Kesalahan server
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        type: integer
        description: ID
      security: *id001
  /api/posts/{id}/toggle-publish:
    patch:
      tags:
      - Penulis
      summary: Ubah status Draf <-> Terbit
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
              data:
                $ref: '#/definitions/PostResponse'
        '400':
          description: Permintaan tidak valid
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          schema:
            $ref: '#/definitions/ErrorResponse'
        '404':
          description: Tidak ditemukan
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Kesalahan server
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        type: integer
        description: ID
      security: *id001
  /api/admin/users:
    get:
      tags:
      - Admin
      summary: Seluruh pengguna beserta total artikel
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
              data:
                type: array
                items:
                  $ref: '#/definitions/AdminUserResponse'
        '401':
          description: Tidak terautentikasi
          schema:
            $ref: '#/definitions/ErrorResponse'
        '403':
          description: Akses ditolak
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Kesalahan server
          schema:
            $ref: '#/definitions/ErrorResponse'
      security: *id001
  /api/admin/posts:
    get:
      tags:
      - Admin
      summary: Arsip seluruh artikel semua penulis
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
              data:
                type: array
                items:
                  $ref: '#/definitions/PostResponse'
        '401':
          description: Tidak terautentikasi
          schema:
            $ref: '#/definitions/ErrorResponse'
        '403':
          description: Akses ditolak
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Kesalahan server
          schema:
            $ref: '#/definitions/ErrorResponse'
      security: *id001
  /api/admin/users/{id}/posts:
    get:
      tags:
      - Admin
      summary: Artikel milik pengguna tertentu
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              status:
                type: string
                example: success
              message:
                type: string
              data:
                type: array
                items:
                  $ref: '#/definitions/PostResponse'
        '400':
          description: Permintaan tidak valid
          schema:
            $ref: '#/definitions/ErrorResponse'
        '401':
          description: Tidak terautentikasi
          schema:
            $ref: '#/definitions/ErrorResponse'
        '403':
          description: Akses ditolak
          schema:
            $ref: '#/definitions/ErrorResponse'
        '500':
          description: Kesalahan server
          schema:
            $ref: '#/definitions/ErrorResponse'
      parameters:
      - name: id
        in: path
        required: true
        type: integer
        description: ID
      security: *id001
definitions:
  ErrorResponse:
    type: object
    properties:
      status:
        type: string
        example: fail
      message:
        type: string
  RegisterRequest:
    type: object
    required:
    - username
    - email
    - password
    properties:
      username:
        type: string
        example: budi
        minLength: 3
        maxLength: 50
      email:
        type: string
        example: budi@mail.id
      password:
        type: string
        example: rahasia123
        minLength: 6
        maxLength: 72
  LoginRequest:
    type: object
    required:
    - username
    - password
    properties:
      username:
        type: string
        example: admin
        description: Username atau email
      password:
        type: string
        example: admin
  UpdateProfileRequest:
    type: object
    properties:
      username:
        type: string
      email:
        type: string
      password:
        type: string
  UserResponse:
    type: object
    properties:
      id:
        type: integer
      username:
        type: string
      email:
        type: string
      role:
        type: string
        enum:
        - member
        - admin
      created_at:
        type: string
        format: date-time
  AuthResponse:
    type: object
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/UserResponse'
  CreatePostRequest:
    type: object
    required:
    - title
    - content
    properties:
      title:
        type: string
        example: Belajar Golang Gin
      category:
        type: string
        enum:
        - Teknologi
        - Pendidikan
        - Gaya Hidup
        - Bisnis
        - Opini
        - Umum
      excerpt:
        type: string
      content:
        type: string
        description: Markdown
      cover_image_path:
        type: string
      is_published:
        type: boolean
  UpdatePostRequest:
    type: object
    required:
    - title
    - content
    properties:
      title:
        type: string
      category:
        type: string
      excerpt:
        type: string
      content:
        type: string
      cover_image_path:
        type: string
  PostResponse:
    type: object
    properties:
      id:
        type: integer
      title:
        type: string
      slug:
        type: string
      category:
        type: string
      excerpt:
        type: string
      content:
        type: string
        description: Hanya pada endpoint detail
      cover_image_path:
        type: string
      is_published:
        type: boolean
      published_at:
        type: string
        format: date-time
      reading_time:
        type: integer
        description: Menit (kata / 200 wpm)
      author:
        type: object
        properties:
          id:
            type: integer
          username:
            type: string
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
  StatsResponse:
    type: object
    properties:
      total:
        type: integer
      total_published:
        type: integer
      total_draft:
        type: integer
  AdminUserResponse:
    type: object
    properties:
      id:
        type: integer
      username:
        type: string
      email:
        type: string
      role:
        type: string
      total_posts:
        type: integer
      total_published:
        type: integer
      created_at:
        type: string
        format: date-time
  GenerateRequest:
    type: object
    required:
    - topic
    properties:
      topic:
        type: string
        example: Dampak AI pada pendidikan tinggi
        minLength: 3
        maxLength: 200
      category:
        type: string
      include_web_search:
        type: boolean
        example: true
  SearchResult:
    type: object
    properties:
      title:
        type: string
      url:
        type: string
      snippet:
        type: string
  GenerateResponse:
    type: object
    properties:
      title:
        type: string
      category:
        type: string
      excerpt:
        type: string
      content:
        type: string
      sources:
        type: array
        items:
          $ref: '#/definitions/SearchResult'
      used_web_search:
        type: boolean
      search_warning:
        type: string
